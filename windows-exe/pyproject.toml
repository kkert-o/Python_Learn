[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learner"
version = "1.1.0"
description = "A Windows Python learning application with a built-in workbench."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "qtawesome>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
